name: Aktualizuj TV Polska
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aktualizacja.yml'
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: tv-polska-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest -v test_aktualizuj.py
      - name: Update playlists
        run: python aktualizuj.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wyniki/
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja playlist TV Polska"
            git push
          fi
