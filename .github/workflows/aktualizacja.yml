name: Aktualizuj TV Polska
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aktualizacja.yml'
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: tv-polska-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest -v test_aktualizuj.py
      - name: Update playlists in batches
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          batches=1
          if [ "$EVENT_NAME" != "schedule" ]; then batches=6; fi
          for ((i=1; i<=batches; i++)); do
            echo "Partia $i/$batches"
            python aktualizuj.py --max-channels 190 --max-pages 3 --max-new 250 --max-film-per-channel 40 --sleep 1.2
            git add wyniki/
            if ! git diff --cached --quiet; then
              git commit -m "Aktualizacja playlist TV Polska - partia $i"
              git push
            fi
            if [ "$i" -lt "$batches" ]; then sleep 30; fi
          done
