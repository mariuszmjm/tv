name: Rozpakuj TV Polska
on:
  push:
    paths:
      - '.github/workflows/rozpakuj.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          unzip -t TV_Polska_Aktualizator_PILOT.zip
          unzip -q TV_Polska_Aktualizator_PILOT.zip -d /tmp/tv-polska
          cp -an /tmp/tv-polska/TV_Polska_Aktualizator/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Rozpakuj oryginalny aktualizator TV Polska"
          git push
